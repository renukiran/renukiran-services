spring.application.name=renukiran-services

server.port=8080

# File-backed local H2 database so development data survives backend restarts.
spring.datasource.url=jdbc:h2:file:./data/renukiran-local;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep local schema and data across restarts. Delete renukiran-services/data/ to reset.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console